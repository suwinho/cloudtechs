services:
  frontend:
    build: ./frontend
    image: suwinho/frontend:${APP_VERSION:-latest}
    container_name: frontend
    networks:
      - proxy-net
    depends_on:
      backend_1:
        condition: service_started
      backend_2:
        condition: service_started

  backend_1:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        BACKEND_PORT: ${BACKEND_PORT:-3000}
    image: suwinho/backend:${APP_VERSION:-latest}
    container_name: backend_1
    env_file:
      - path: .env.common
        required: true
      - path: .env.local
        required: false
    environment:
      INSTANCE_ID: "Backend 1"
      BACKEND_PORT: ${BACKEND_PORT:-3000}
      PORT: ${BACKEND_PORT:-3000}
      PGDATABASE: ${POSTGRES_DB:?Ustaw POSTGRES_DB w pliku .env}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    networks:
      - proxy-net
      - db-net
      - app-net
    secrets:
      - db_password
      - db_user
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:${BACKEND_PORT:-3000}/health" ]
      interval: 5s
      timeout: 5s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  backend_2:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        BACKEND_PORT: ${BACKEND_PORT_2:-3001}
    image: suwinho/backend:${APP_VERSION:-latest}
    container_name: backend_2
    env_file:
      - path: .env.common
        required: true
      - path: .env.local
        required: false
    environment:
      INSTANCE_ID: "Backend 2"
      BACKEND_PORT: ${BACKEND_PORT_2:-3001}
      PORT: ${BACKEND_PORT_2:-3001}
      PGDATABASE: ${POSTGRES_DB:?Ustaw POSTGRES_DB w pliku .env}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    networks:
      - proxy-net
      - db-net
      - app-net
    secrets:
      - db_password
      - db_user
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:${BACKEND_PORT_2:-3001}/health" ]
      interval: 5s
      timeout: 5s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./backend
      dockerfile: ../worker/Dockerfile
      args:
        BACKEND_PORT: ${BACKEND_PORT_3:-3002}
    container_name: worker
    env_file:
      - path: .env.common
        required: true
      - path: .env.local
        required: false
    environment:
      INSTANCE_ID: "Worker"
      BACKEND_PORT: ${BACKEND_PORT_3:-3002}
      PORT: ${BACKEND_PORT_3:-3002}
      PGDATABASE: ${POSTGRES_DB:?Ustaw POSTGRES_DB w pliku .env}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    networks:
      - app-net
      - db-net
    secrets:
      - db_password
      - db_user
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  adminer:
    image: adminer:latest
    container_name: adminer
    profiles:
      - debug
    ports:
      - "8080:8080"
    networks:
      - db-net

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin4
    profiles:
      - debug
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@admin.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
    networks:
      - db-net
    depends_on:
      postgres:
        condition: service_healthy
  
  db-migrator:
    image: alpine
    profiles:
      - migrate
    restart: no
    command: sh -c "echo 'Running migrations...'"
    networks:
      - db-net
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:7
    container_name: redis
    networks:
      - app-net
    volumes:
      - redis-data:/data
    environment:
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:15
    container_name: postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mydb}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      POSTGRES_USER_FILE: /run/secrets/db_user
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - db-net
    secrets:
      - db_password
      - db_user
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$(cat /run/secrets/db_user) -d ${POSTGRES_DB:-mydb}"]
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  proxy-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.18.0.0/24
          gateway: 172.18.0.1
  app-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.19.0.0/24
          gateway: 172.19.0.1
  db-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24
          gateway: 172.20.0.1

volumes:
  postgres-data:
  redis-data:

secrets:
  db_password:
    file: ./secrets/db_password.txt
  db_user:
    file: ./secrets/db_user.txt