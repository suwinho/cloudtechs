worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;

    # Dwa backendy - nginx rozdziela ruch między nie (load balancing)
    upstream backend_cluster {
        server api-a:3000;
        server api-b:3000;
    }

    server {
        listen 80;

        # Frontend - pliki statyczne (React)
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        # Backend - wszystko co zaczyna sie od /api/ idzie do backendu
        location /api/ {
            proxy_pass http://backend_cluster/;
        }
    }
}