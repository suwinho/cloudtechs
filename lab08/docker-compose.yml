services:
  frontend:
    build: ./frontend
    container_name: frontend
    ports:
      - "80:80"
    networks:
      - proxy-net
    configs:
      - source: nginx_config
        target: /etc/nginx/nginx.conf
    depends_on:
      backend_1:
        condition: service_started
      backend_2:
        condition: service_started

  backend_1:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        BACKEND_PORT: ${BACKEND_PORT:-3000}
    container_name: backend_1
    environment:
      INSTANCE_ID: "Backend 1"
      BACKEND_PORT: ${BACKEND_PORT:-3000}
      PORT: ${BACKEND_PORT:-3000}
      PGDATABASE: ${POSTGRES_DB}
      REDIS_URL: ${REDIS_URL}
      PGHOST: postgres
    networks:
      - proxy-net
      - db-net
      - app-net
    configs:
      - source: app_config
        target: /app/app.config.json
    secrets:
      - db_password
      - db_user
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:${BACKEND_PORT:-3000}/health" ]
      interval: 5s
      timeout: 5s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  backend_2:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        BACKEND_PORT: 3001
    container_name: backend_2
    environment:
      INSTANCE_ID: "Backend 2"
      BACKEND_PORT: 3001
      PORT: 3001
      PGDATABASE: ${POSTGRES_DB}
      REDIS_URL: ${REDIS_URL}
      PGHOST: postgres
    networks:
      - proxy-net
      - db-net
      - app-net
    configs:
      - source: app_config
        target: /app/app.config.json
    secrets:
      - db_password
      - db_user
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:3001/health" ]
      interval: 5s
      timeout: 5s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./backend
      dockerfile: ../worker/Dockerfile
      args:
        BACKEND_PORT: 3002
    container_name: worker
    environment:
      INSTANCE_ID: "Worker"
      BACKEND_PORT: 3002
      PORT: 3002
      PGDATABASE: ${POSTGRES_DB}
      REDIS_URL: ${REDIS_URL}
      PGHOST: postgres
    networks:
      - app-net
      - db-net
    secrets:
      - db_password
      - db_user
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  adminer:
    image: adminer:latest
    container_name: adminer
    ports:
      - "8080:8080"
    networks:
      - db-net

  redis:
    image: redis:7
    container_name: redis
    networks:
      - app-net
    volumes:
      - redis-data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:15
    container_name: postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      POSTGRES_USER_FILE: /run/secrets/db_user
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - db-net
    secrets:
      - db_password
      - db_user
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$(cat /run/secrets/db_user) -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  proxy-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.18.0.0/24
          gateway: 172.18.0.1
  app-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.19.0.0/24
          gateway: 172.19.0.1
  db-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24
          gateway: 172.20.0.1

volumes:
  postgres-data:
  redis-data:

configs:
  nginx_config:
    file: ./nginx.conf
  app_config:
    file: ./backend/app.config.json

secrets:
  db_password:
    file: ./secrets/db_password.txt
  db_user:
    file: ./secrets/db_user.txt